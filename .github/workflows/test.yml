name: GoalVerse Upload

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"

  workflow_dispatch:

jobs:
  upload-video:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Re-encode videos
        run: |
          mkdir -p encoded

          shopt -s nullglob
          files=(videos/*.mp4)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No MP4 files found."
            exit 1
          fi

          for file in "${files[@]}"; do
            filename=$(basename "$file")

            ffmpeg -y -i "$file" \
              -c:v libx264 \
              -preset medium \
              -crf 23 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              -c:a aac \
              -b:a 128k \
              "encoded/$filename"
          done

      - name: Replace original videos
        run: |
          rm -rf videos
          mv encoded videos

      - name: Run uploader
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python main.py

      - name: Commit updated repository
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add videos
          git add uploaded.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Remove uploaded video after upload"
            git push
          fi
