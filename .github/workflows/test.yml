name: GoalVerse Auto Upload

on:
  workflow_dispatch:

  schedule:
    # 12:00 PM Eastern Time (approx.)
    - cron: "0 16 * * *"

    # 5:00 PM Eastern Time (approx.)
    - cron: "0 21 * * *"

    # 9:00 PM Eastern Time (approx.)
    - cron: "0 1 * * *"

jobs:
  upload:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create OAuth Files
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          echo "$YOUTUBE_TOKEN_JSON" > token.json
          echo "$YOUTUBE_OAUTH_JSON" > oauth.json

      - name: Run GoalVerse
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          python main.py
